[package]
name = "magma-external-blockbuilder-tests"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "test-builder-bundle"
path = "src/main.rs"

[[bin]]
name = "print-builder-pubkey"
path = "src/bin/print_pubkey.rs"

[dependencies]
tokio = { workspace = true, features = ["full"] }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-network = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { version = "0.8", features = ["reqwest"] }
alloy-rpc-types-eth = { workspace = true }
alloy-signer = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-transport-http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = "1.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
hex = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }
sha3 = "0.10"
rand = "0.8"

# Use Monad's own crypto implementation
monad-secp = { workspace = true }
monad-crypto = { workspace = true }
